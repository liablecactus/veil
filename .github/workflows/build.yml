name: build-android
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [compat, modern]
    steps:
      - uses: actions/checkout@v4
      - name: Quellen entpacken
        run: mkdir -p apps && tar xJf veil-android-src.tar.xz -C apps
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Debug-APK bauen (${{ matrix.variant }})
        run: bash apps/android/ci-build.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-android-${{ matrix.variant }}
          path: apps/android/ci-out/${{ matrix.variant }}
          if-no-files-found: warn
