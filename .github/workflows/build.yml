name: build-android
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellen entpacken
        run: mkdir -p apps && tar xJf veil-android-src.tar.xz -C apps
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Debug APK
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Release APK
        continue-on-error: true
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veil-android-apk
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
